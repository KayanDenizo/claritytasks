<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Syne:wght@500&display=swap"
        rel="stylesheet">
    <title>Cadastrar | Clarity Tasks</title>
</head>

<body>
    <main>

        <section class="hero-section">
            <header>
                <h3 class="title">Clarity Tasks</h3>
                <p class="subtitle">Cognitive Clarity for High Achievers</p>
            </header>

            <div class="hero-container">
                <div class="headline">
                    <p>Crie sua Conta</p>
                </div>
                <form id="form-cadastro" method="post">

                    <div class="name">
                        <label for="name">Nome</label>
                        <input type="text" id="name" required placeholder="Seu nome Completo">
                        <!-- <img src="" alt="icone"> -->
                    </div>

                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="nome@exemplo.com">
                        <!-- <img src="" alt="icone"> -->
                    </div>

                    <div class="password">
                        <label for="password">Senha</label>
                        <input type="password" id="password" required placeholder="Digite sua senha">
                        <!-- <img src="" alt="icone"> -->
                    </div>

                    <div class="checkbox">
                        <input required type="checkbox">
                        <label for="checkbox">Ao me cadastrar, eu concordo com os Termos de
                            Serviço e Política de Privacidade.</label>
                    </div>

                    <button class="btn-cadastrar" type="submit" id="btn-cadastrar">Cadastrar</button>

                    <p class="gray-line"></p>

                    <a class="signup" id="signup" href="signin.html">Já tenho uma conta</a>
                </form>
            </div>


            <div class="footer">
                <img src="Decorative Footer Element_margin (1).png" alt="">
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
