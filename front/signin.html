<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Clarity Tasks</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>

        <section class="hero-section">
            <header>
                <h3 class="title">Clarity Tasks</h3>
                <p class="subtitle">Simplifique seu fluxo de trabalho com foco
                    absoluto.</p>
            </header>

            <div class="hero-container">

                <form action="signin.html" id="form" method="post">

                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="nome@exemplo.com">
                        <img src="" alt="icone">
                    </div>

                    <div class="password">
                        <div class="container-flex">
                            <label for="password">Senha</label>
                            <a href="signin.html">Esqueceu a senha</a>
                        </div>
                        <input type="password" id="password" placeholder="Digite sua senha">
                        <img src="" alt="icone">
                    </div>

                    <button class="btn-login" id="btn-login">Entrar</button>

                    <div class="container">
                        <p class="gray-line"></p>
                        <p>OU CONTINUE COM</p>
                        <p class="gray-line"></p>
                    </div>

                    <div class="buttons-container">
                        <button>botao1</button>
                        <button>botao2</button>
                    </div>

                    <a href="index.html">Nao tem uma conta? Criar conta</a>
                </form>
            </div>


            <div class="footer">
                <img src="Decorative Footer Element_margin (1).png" alt="">
            </div>
        </section>

    </main>
</body>

</html>
