<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="/front/index.css">
</head>

<body>

    <main class="homepage-main">

        <aside class="sideNavBar">
            <div class="topContainer">
                <div class="sidebar">
                    <h2>Task Master</h2>
                    <span>High Achiever Status</span>
                </div>

                <button class="newTask">+ New Task</button>

                <div class="asideNav">
                    <a class="items-aside itemActive" href="#">All Tasks</a>
                    <a class="items-aside" href="#">Today</a>
                    <a class="items-aside" href="#">Upcoming</a>
                    <a class="items-aside" href="#">Completed</a>
                </div>
            </div>
        </aside>

        <!-- Agrupa navbar e conteudo principal em uma coluna.
             Como .homepage-main usa flex, deixar header e section soltos fazia os dois ficarem na mesma linha da sidebar. -->
        <div class="homepage-content">
            <header>
                <nav>
                    <div class="title">
                        <p>Clarity Tasks</p>
                    </div>

                    <div class="main">
                        <a href="#">Tasks</a>
                        <a href="#">Focus</a>
                        <a href="#">Calendar</a>

                    </div>

                    <div class="search-container">
                        <input type="text" placeholder="Search Tasks">
                        <p>icone de sino</p>
                        <img src="" alt="profile">
                    </div>
                </nav>
            </header>


            <section class="hero-section-tasks">
                <div class="mytasks">
                    <h1>Minhas Tarefas</h1>
                    <span class="gray mytasks-desc">Mantenha o foco no que é importante. Suas tarefas principais <br>
                        organizadas por prioridade e tempo.</span>
                </div>

                <div class="add-task">
                    <div class="container-add-task">
                        <input type="text" id="addTaskInput" placeholder="Adicionar Tarefa">
                        <button type="submit" id="addBtnTask" class="add-btn">Adicionar</button>
                    </div>
                </div>

                <div id="taskContainer" class="all-tasks">
                    
                </div>

            </section>
        </div>

    </main>


    <script src="/front/js/homepage.js"></script>
</body>

</html>
